; Heltec V3 con ILI9225 + Device-UI + OLED secundaria
[env:heltec-v3-tft]
extends = esp32s3_base
board = heltec_wifi_lora_32_V3
board_level = pr
board_check = true
board_build.partitions = default_8MB.csv

build_unflags = 
  -flto

build_flags = 
  ${esp32s3_base.build_flags}
  -Os
  -ffunction-sections
  -fdata-sections
  -Wl,--gc-sections
  -Wl,-Map,output.map
  -D HELTEC_V3
  -D MESHTASTIC_EXCLUDE_WEBSERVER=1
  -D MESHTASTIC_EXCLUDE_WIFI=1
  -D MESHTASTIC_EXCLUDE_ENVIRONMENTAL_SENSOR=1
  -D MESHTASTIC_EXCLUDE_POWER_TELEMETRY=1
  -D MESHTASTIC_EXCLUDE_RANGETEST=1
  -D MESHTASTIC_EXCLUDE_DETECTIONSENSOR=1
  -D MESHTASTIC_EXCLUDE_PAXCOUNTER=1
  -D MESHTASTIC_EXCLUDE_AUDIO=1
  -D NO_ESP32_BT_CLASSIC=1
  -D MESHTASTIC_EXCLUDE_BLUETOOTH=1
  -D MESHTASTIC_EXCLUDE_CANNEDMESSAGES=1
  -D MESHTASTIC_EXCLUDE_INPUTBROKER=1
  ; Formatear LittleFS si falla (temporal para resolver errores "no permits")
  -D FORMAT_LITTLEFS_IF_FAILED=1
  ; Device-UI sin Bluetooth ni PSRAM (RAM limitada)
  -D FORCE_DISPLAY_MODE=meshtastic_Config_DisplayConfig_DisplayMode_COLOR
  -I variants/esp32s3/heltec_v3_UI
  -D GPS_POWER_TOGGLE
  -D GPS_RX_PIN=33
  -D GPS_TX_PIN=34
  -D GPS_SERIAL_NUM=1
  -D GPS_BAUDRATE=9600
  
  ; CardKB support
  -D INPUTDRIVER_I2C_KBD_TYPE=0x5F
  
  ; Device-UI configuration (device-ui usa HAS_TFT, baseui usa HAS_SCREEN)
  -D CONFIG_DISABLE_HAL_LOCKS=1
  -D INPUTDRIVER_BUTTON_TYPE=0
  -D HAS_SCREEN=0
  -D HAS_TFT=1
  -D RAM_SIZE=24
  
  ; LovyanGFX driver usando clase personalizada LGFX_HELTEC_V3_ILI9225
  ; Panel ILI9225 - 2" 176x220 SPI TFT en bus SPI3_HOST (separado de LoRa)
  -D USE_LGFX_HELTEC_V3_ILI9225
  -D LGFX_DRIVER=LGFX_HELTEC_V3_ILI9225
  -D LGFX_CFG_HOST=SPI3_HOST
  -D LGFX_SCREEN_WIDTH=176
  -D LGFX_SCREEN_HEIGHT=220
  -D LGFX_PIN_SCK=19
  -D SCREEN_ROTATE
  
  ; LVGL configuration ULTRA optimizada para RAM limitada sin PSRAM
  -D LV_LVGL_H_INCLUDE_SIMPLE
  -D LV_CONF_INCLUDE_SIMPLE
  -D LV_COMP_CONF_INCLUDE_SIMPLE
  -D USE_LOG_DEBUG
  -D LOG_DEBUG_INC=\"DebugConfiguration.h\"
  
  ; 🧠 MEMORIA Y BUFFERS - 64 KB para LVGL (intento con más margen)
  -D LV_MEM_CUSTOM=1
  -D LV_MEM_SIZE=65536
  -D LV_IMG_CACHE_DEF_SIZE=0
  -D LV_IMAGE_CACHE_DEF_SIZE=0
  
  ; 🖼️ BUFFER DE DIBUJO - Optimizado para 176×220 sin PSRAM
  -D LV_COLOR_DEPTH=16
  -D LV_COLOR_16_SWAP=0
  -D LV_DPI_DEF=130
  -D LV_DISP_DEF_REFR_PERIOD=40
  -D LV_DRAW_BUF_SIZE=6144
  
  ; 🧱 OPTIMIZACIONES - Deshabilitar todo lo no esencial
  -D LV_USE_USER_DATA=0
  -D LV_USE_LOG=0
  -D LV_USE_ASSERT_MEM=0
  -D LV_USE_ASSERT_OBJ=0
  -D LV_USE_DEBUG=0
  -D LV_USE_PERF_MONITOR=0
  -D LV_USE_MEM_MONITOR=0
  -D LV_USE_SYSMON=0
  -D LV_USE_PROFILER=0
  -D LV_USE_REFR_DEBUG=0
  -D LV_BUILD_TEST=0
  
  ; 🎨 EFECTOS Y TRANSICIONES - Deshabilitar todos los efectos visuales
  -D LV_USE_ANIMATION=1
  -D LV_USE_SHADOW=0
  -D LV_SHADOW_CACHE_SIZE=0
  -D LV_USE_GRADIENT=0
  -D LV_GRADIENT_MAX_STOPS=0
  -D LV_USE_IMG_TRANSFORM=0
  -D LV_USE_IMG_SCALE=0
  -D LV_USE_ARC=0
  -D LV_USE_CANVAS=0
  -D LV_USE_CHART=0
  -D LV_USE_METER=0
  -D LV_USE_TILEVIEW=0
  -D LV_USE_MSGBOX=0
  -D LV_USE_DRAW_MASKS=0
  -D LV_USE_LAYER=0
  -D LV_DRAW_SW_COMPLEX=0
  -D LV_USE_LARGE_COORD=0
  
  ; 🗜️ FUENTES - Solo Montserrat 12
  -D LV_FONT_MONTSERRAT_12=1
  -D LV_FONT_MONTSERRAT_14=0
  -D LV_FONT_MONTSERRAT_16=0
  -D LV_FONT_MONTSERRAT_20=0
  
  ; LAYOUTS
  -D LV_USE_FLEX=1
  -D LV_USE_GRID=0
  -D LV_USE_THEME_DEFAULT=1
  -D LV_USE_THEME_BASIC=0
  
  ; RadioLib debug configuration
  -D RADIOLIB_DEBUG_BASIC=0
  -D RADIOLIB_DEBUG_SPI=0
  -D RADIOLIB_DEBUG_PROTOCOL=0
  -D RADIOLIB_SPI_PARANOID=0
  
  ; Device-UI display configuration (usando resolución 176x220 con VIEW_320x240)
  -D DISPLAY_SIZE=176x220
  -D VIEW_320x240
  -D USE_PACKET_API
  -D MAP_FULL_REDRAW
  -D DEVICE_UI_DISABLE_MAP=1
  -D DEVICE_UI_DISABLE_RADAR=1

lib_deps =
  ${esp32s3_base.lib_deps}
  lovyan03/LovyanGFX@^1.1.16
  ${device-ui_base.lib_deps}
