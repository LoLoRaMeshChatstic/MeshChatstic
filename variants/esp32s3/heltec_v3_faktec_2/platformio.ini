[env:heltec-v3-faktec-2] 
extends = esp32s3_base
board = heltec_wifi_lora_32_V3
board_level = pr
board_check = true
board_build.partitions = default_8MB.csv
build_src_filter = ${esp32s3_base.build_src_filter} -<platform/extra_variants/>
build_unflags = 
  -flto
build_flags = 
  ${esp32s3_base.build_flags}
  -fno-lto
  -D HELTEC_V3
  -I variants/esp32s3/heltec_v3_faktec_2
  -D GPS_POWER_TOGGLE
  ; Pantalla ILI9225 - 2" 176x220 SPI TFT (dimensiones físicas del panel)
  -D USE_ILI9225
  -D TFT_WIDTH=176
  -D TFT_HEIGHT=220
  ; Pines SPI para ILI9225 (bus separado de LoRa)
  -D ILI9225_CS=5
  -D ILI9225_SCK=19
  -D ILI9225_MOSI=20
  -D ILI9225_MISO=-1
  -D ILI9225_DC=7
  -D ILI9225_RST=33
  -D ILI9225_BL=21
  -D ILI9225_SPI_HOST=SPI3_HOST
  -D SPI_FREQUENCY=10000000
  -D SPI_READ_FREQUENCY=8000000
  -D TFT_BACKLIGHT_ON=HIGH
  -D TFT_OFFSET_X=0
  -D TFT_OFFSET_Y=0
  -D TFT_OFFSET_ROTATION=1
  -D TFT_INVERT=false
  -D TFT_RGB_ORDER=false
  -D SCREEN_ROTATE
  ; Bus SPI separado - NO compartido con LoRa
  -D ILI9225_BUS_SHARED=false
  ; Habilitar pantalla secundaria (OLED interno como monitor de estado)
  ; El OLED se detectará automáticamente y se usará como StatusDisplay
  ; mientras que ILI9225 será la pantalla principal
lib_deps = 
  ${esp32s3_base.lib_deps}
  lovyan03/LovyanGFX@^1.1.16
